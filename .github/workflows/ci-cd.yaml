name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
#  pull_request:
#    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Test
        run: |
          docker build -t ${{ secrets.REGISTRY_URL }}/python-api:${{ github.sha }} .
          # Add your test commands here

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.REGISTRY_URL }}/python-api:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.REGISTRY_URL }}/python-api:${{ github.sha }}

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.8.0

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install python-api ./python-api \
            --set image.tag=${{ github.sha }} \
            --namespace production \
            --create-namespace

