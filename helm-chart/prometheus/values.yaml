kube-prometheus-stack:
  enabled: true
  prometheusOperator:
    enabled: true
    admissionWebhooks:
      enabled: true
      patch:
        enabled: true
      certManager:
        enabled: false
      # Add failurePolicy to handle missing secret gracefully
      failurePolicy: Ignore
      # Create the secret
      secrets:
        ca: prometheus-kube-prometheus-admission
    tls:
      enabled: true
      # Generate self-signed certificate
      internal:
        enabled: true
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 30d
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: 1000m
          memory: 2Gi
  grafana:
    enabled: true
    adminPassword: admin
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  alertmanager:
    enabled: true
    alertmanagerSpec:
      retention: 120h
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['alertname', 'job']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: 'slack'
        routes:
        - match:
            severity: critical
          receiver: 'slack'
          continue: true
      receivers:
      - name: 'slack'
        slack_configs:
        - api_url: '${SLACK_WEBHOOK_URL}'
          channel: '#alerts'
          send_resolved: true
          title: '{{ template "slack.default.title" . }}'
          text: '{{ template "slack.default.text" . }}'
  kubelet:
    serviceMonitor:
      trackTimestampsStaleness: false
