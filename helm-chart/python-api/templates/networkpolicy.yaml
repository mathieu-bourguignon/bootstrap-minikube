apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-network-policy
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from monitoring namespace
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
    # Allow from logging namespace
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: logging
    # Allow from default namespace
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: default
  egress:
    # Allow to monitoring namespace
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
    # Allow to logging namespace
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: logging
    # Allow to default namespace
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: default
