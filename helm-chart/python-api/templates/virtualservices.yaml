apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: prometheus-vs
  namespace: monitoring
spec:
  hosts:
  - "prometheus.example.com"
  gateways:
  - default/python-api-gateway
  http:
    route:
    - destination:
        host: prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local
        kubectl port-forward -n monitoring svc/prometheus-kube-prometheus-prometheus 9090:9090
        port:
          number: 9090
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: alertmanager-vs
  namespace: monitoring
spec:
  hosts:
  - "alertmanager.example.com"
  gateways:
  - default/python-api-gateway
  http:
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: prometheus-kube-prometheus-alertmanager.monitoring.svc.cluster.local
        port:
          number: 9093
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: grafana-vs
  namespace: monitoring
spec:
  hosts:
  - "grafana.example.com"
  gateways:
  - default/python-api-gateway
  http:
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: grafana.monitoring.svc.cluster.local
        port:
          number: 80
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: loki-vs
  namespace: logging
spec:
  hosts:
  - "loki.example.com"
  gateways:
  - default/python-api-gateway
  http:
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: loki.logging.svc.cluster.local
        port:
          number: 3100

