loki-stack:
  loki:
    enabled: true
    persistence:
      enabled: true
      size: 10Gi
    config:
      auth_enabled: false
      ingester:
        lifecycler:
          ring:
            kvstore:
              store: inmemory
        chunk_idle_period: 15m
        chunk_retain_period: 30s
      schema_config:
        configs:
          - from: 2020-05-15
            store: boltdb-shipper
            object_store: filesystem
            schema: v11
            index:
              prefix: index_
              period: 24h
      storage_config:
        boltdb_shipper:
          active_index_directory: /data/loki/index
          cache_location: /data/loki/index_cache
          shared_store: filesystem
        filesystem:
          directory: /data/loki/chunks

  promtail:
    enabled: true
    config:
      lokiAddress: http://{{ .Release.Name }}-loki:3100/loki/api/v1/push
      snippets:
        scrapeConfigs:
          - job_name: "python-api-logs"
            static_configs:
              - targets: ["localhost"]
                labels:
                  app: python-api
                  __path__: /var/log/python-app/*.log

  grafana:
    enabled: false

  serviceMonitor:
    enabled: true

