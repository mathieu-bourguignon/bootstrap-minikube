apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: hello-minikube-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: hello-minikube
spec:
  hosts:
  - "*"
  gateways:
  - hello-minikube-gateway
  http:
  - match:
    - uri:
        prefix: /hello
    rewrite:
      uri: /
    route:
    - destination:
        host: hello-minikube
        port:
          number: 8080
